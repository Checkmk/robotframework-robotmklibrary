[project]
name = "robotframework-robotmklibrary"
version = "0.0.4"
description = "A Robot Framework keyword library intended to be used with Robotmk."
readme = "README.md"
authors = [
    { name = "Jörg Herbel", email = "joerg.herbel@checkmk.com" }
]
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "robotframework>=7.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "opentelemetry-test-utils>=0.66b2",
    "pytest>=9.2",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D",
    "E501",
    "N999",
    "TC",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "possibly-undefined",
]
disallow_any_expr = true
disallow_any_explicit = true
# Calls into these packages are untyped at their end, not ours.
untyped_calls_exclude = ["robot", "opentelemetry"]

[[tool.mypy.overrides]]
module = "tests.*"
# Robot Framework and the SDK hand the tests Any-typed values (run results, span ids).
disallow_any_expr = false

[[tool.mypy.overrides]]
module = "robot.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/RobotmkLibrary"]

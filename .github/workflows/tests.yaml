---
name: "Tests"

on:
  workflow_call: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python_version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        python-version: ${{ matrix.python_version }}

    - run: uv sync

    - run: uv run ruff format --diff

    - run: uv run ruff check

    - run: uv run mypy src tests

    - run: uv run pytest
